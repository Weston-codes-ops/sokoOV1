spring.application.name=sokoonline

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sokoonline}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT configuration (loaded via environment; rotate secrets before any real deployment)
jwt.secret=${JWT_SECRET:REPLACE_WITH_64_PLUS_CHAR_HEX_OR_BASE64_SECRET_BEFORE_DEPLOY_0123456789ABCDEF0123456789ABCDEF}
jwt.issuer=${JWT_ISSUER:sokoonline-api}
jwt.audience=${JWT_AUDIENCE:sokoonline-web}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
