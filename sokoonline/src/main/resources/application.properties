spring.application.name=sokoonline

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.datasource.url = ${SPRING_DATASOURCE_URL:}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT configuration (loaded via environment; rotate secrets before any real deployment)
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:}
jwt.audience=${JWT_AUDIENCE:}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:}
admin.registration-key=${ADMIN_REGISTRATION_KEY:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:}
